apiVersion: apps/v1
kind: Deployment
metadata:
  name: promart-deployment
  labels:
    app: retail
spec:
  replicas: 2 # Kubernetes levantará 2 copias idénticas del servidor para soportar caídas
  selector:
    matchLabels:
      app: retail
  template:
    metadata:
      labels:
        app: retail
    spec:
      containers:
      - name: promart-web
        image: promart-retail:v1
        imagePullPolicy: Never # Le dice a K8s que use la imagen de tu Docker Desktop local
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: promart-service
spec:
  type: NodePort
  selector:
    app: retail
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080 # Exponemos el Kubernetes en el puerto 30080 de tu laptop
