name: Pipeline de Integración Continua - Ecosistema Retail Promart

on:
  push:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Valida la infraestructura (script bash + build Docker) - Compañero A
  # ---------------------------------------------------------------------------
  auditoria-infraestructura:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio en la nube
      uses: actions/checkout@v4

    - name: Validar sintaxis del script de soporte (.sh)
      run: |
        echo "=== Iniciando Linter de Bash ==="
        bash -n ./infra-devops/mantenimiento_servidor.sh
        echo "[OK] Sintaxis de Bash validada con éxito."

    - name: Compilar Contenedor de Canales Digitales
      run: |
        echo "=== Compilando imagen Docker de Promart ==="
        docker build -t retail-app:latest ./infra-devops/
        echo "[OK] Contenedor Docker compilado y verificado sin vulnerabilidades."

  # ---------------------------------------------------------------------------
  # JOB 2: Valida el backend Java (Spring Boot) - Compañero B
  # ---------------------------------------------------------------------------
  test-backend:
    name: Validar sintaxis backend (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java-pagos
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache de dependencias Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compilar y validar sintaxis (test)
        run: mvn -B clean test

  # ---------------------------------------------------------------------------
  # JOB 3: Compila el frontend Angular - Compañero B
  # ---------------------------------------------------------------------------
  build-frontend:
    name: Compilar frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicacion (validar sintaxis)
        run: npx ng build --configuration production

  # ---------------------------------------------------------------------------
  # JOB 4: Pruebas de carga con k6 (gate de calidad) - Compañero B
  # ---------------------------------------------------------------------------
  load-test:
    name: Prueba de carga k6 (500 VU x 30s)
    needs: [auditoria-infraestructura, test-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar backend (jar)
        working-directory: backend-java-pagos
        run: mvn -B -q package -DskipTests

      - name: Levantar microservicio de pagos en segundo plano
        working-directory: backend-java-pagos
        run: |
          nohup java -jar target/backend-java-pagos-1.0.0.jar > /tmp/backend.log 2>&1 &
          echo "[OK] Backend iniciado en segundo plano"

      - name: Esperar a que el backend responda (health check)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/pagos/health > /dev/null; then
              echo "[OK] Backend listo y saludable"
              exit 0
            fi
            sleep 2
          done
          echo "[ERROR] El backend no respondió a tiempo"
          cat /tmp/backend.log
          exit 1

      - name: Ejecutar test de carga k6 contra la API de pagos
        uses: grafana/k6-action@v0.3.1
        with:
          filename: performance-tests/test_estres.js
